<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Prompt Library | Procurement</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Dark shell derived from Dark Steel */
    --bg: #20272C;
    --bg-rail: #1B2226;
    --surface: #2A3238;
    --surface-h: #313A41;
    --surface-3: #3A444C;
    --border: rgba(255,255,255,0.09);
    --border-h: rgba(255,255,255,0.18);

    --text: #EDF1F3;
    --muted: #A4B0B8;
    --muted-2: #78868F;

    /* Signature Blue, brightened for legibility on dark */
    --sig: #4C6BE0;
    --sig-h: #6182F0;
    --sig-dim: rgba(76,107,224,0.14);
    --sig-border: rgba(76,107,224,0.34);

    /* Brand cyan + light blue for stage accents */
    --stage1: #35BDE4;
    --stage1-dim: rgba(53,189,228,0.11);
    --stage1-border: rgba(53,189,228,0.28);
    --stage2: #8FA8F5;
    --stage2-dim: rgba(143,168,245,0.11);
    --stage2-border: rgba(143,168,245,0.28);

    --serif: 'Wallace Serif Light', 'Wallace Serif', ui-serif, 'Iowan Old Style', serif;
    --sans: 'Wallace Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Cascadia Code', 'Consolas', ui-monospace, monospace;

    --r: 10px;
    --r-sm: 7px;
    --r-xs: 5px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  :focus-visible { outline: 2px solid var(--sig-h); outline-offset: 2px; border-radius: 3px; }

  /* ── MASTHEAD ── */
  .masthead {
    height: 56px;
    background: var(--bg-rail);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 22px; gap: 12px;
    position: sticky; top: 0; z-index: 60;
  }
  .mark {
    width: 26px; height: 26px; border-radius: var(--r-xs);
    background: linear-gradient(135deg, var(--sig), var(--stage1));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .masthead:hover .mark { transform: rotate(-6deg) scale(1.05); box-shadow: 0 0 0 4px var(--sig-dim); }
  .mark svg { width: 15px; height: 15px; stroke: #fff; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }

  .masthead-title { font-family: var(--serif); font-size: 16px; letter-spacing: 0.1px; color: var(--text); }
  .masthead-div { width: 1px; height: 18px; background: var(--border-h); }
  .masthead-eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 1.1px; text-transform: uppercase;
    color: var(--muted-2);
  }

  /* ── SHELL ── */
  .shell {
    display: grid;
    grid-template-columns: 348px 1fr;
    min-height: calc(100vh - 56px);
    align-items: start;
  }

  /* ── RAIL ── */
  .rail {
    background: var(--bg-rail);
    border-right: 1px solid var(--border);
    padding: 22px 16px 40px;
    position: sticky; top: 56px;
    max-height: calc(100vh - 56px);
    overflow-y: auto;
  }
  .rail::-webkit-scrollbar, .prompt-body::-webkit-scrollbar { width: 8px; }
  .rail::-webkit-scrollbar-thumb, .prompt-body::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 8px; }

  .rail-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 4px; padding: 0 6px; }
  .rail-title { font-family: var(--serif); font-size: 19px; color: var(--text); }
  .rail-total { font-size: 11px; font-weight: 600; letter-spacing: 0.6px; text-transform: uppercase; color: var(--muted-2); }

  .filter-label {
    font-size: 10px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase;
    color: var(--muted-2); padding: 0 6px; margin-bottom: 8px;
  }
  .filters { display: flex; flex-direction: column; gap: 2px; margin-bottom: 22px; }
  .filter-btn {
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    width: 100%; padding: 8px 12px 8px 14px;
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    color: var(--muted); background: none; border: none;
    border-radius: var(--r-sm); cursor: pointer; text-align: left;
    transition: color 0.14s, background 0.14s;
  }
  .filter-btn::before {
    content: ''; position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
    width: 2px; height: 0; background: var(--sig-h); border-radius: 2px;
    transition: height 0.2s ease;
  }
  .filter-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
  .filter-btn:hover::before { height: 12px; }
  .filter-btn.active { color: var(--text); font-weight: 600; background: rgba(255,255,255,0.05); }
  .filter-btn.active::before { height: 18px; }
  .pill-count {
    font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 20px;
    background: var(--surface-3); color: var(--muted); min-width: 20px; text-align: center;
    transition: background 0.14s, color 0.14s;
  }
  .filter-btn.active .pill-count { background: var(--sig-dim); color: var(--sig-h); }

  /* ── DENSITY TOGGLE ── */
  .list-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px; margin-bottom: 10px; }
  .density {
    display: flex; gap: 2px; padding: 2px;
    background: rgba(255,255,255,0.04); border: 1px solid var(--border);
    border-radius: var(--r-sm);
  }
  .density-btn {
    display: flex; align-items: center; justify-content: center;
    width: 28px; height: 24px; border: none; background: none;
    border-radius: var(--r-xs); cursor: pointer; color: var(--muted-2);
    transition: background 0.14s, color 0.14s;
  }
  .density-btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .density-btn:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  .density-btn.active { color: var(--sig-h); background: var(--sig-dim); }

  /* ── WORKFLOW LIST ── */
  .wf-list { display: flex; flex-direction: column; gap: 4px; }

  .wf-item {
    position: relative;
    display: flex; align-items: center; gap: 12px;
    width: 100%; padding: 11px 12px; text-align: left;
    background: none; border: 1px solid transparent; border-radius: var(--r-sm);
    cursor: pointer; color: var(--text);
    font-family: var(--sans);
    transition: background 0.15s, border-color 0.15s, transform 0.15s;
    animation: slideIn 0.26s ease both;
  }
  .wf-item:hover { background: var(--surface); border-color: var(--border); transform: translateX(2px); }
  .wf-item.selected { background: var(--surface); border-color: var(--sig-border); }
  .wf-item.selected::after {
    content: ''; position: absolute; left: -16px; top: 8px; bottom: 8px;
    width: 2px; background: var(--sig-h); border-radius: 0 2px 2px 0;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: none; } }

  .wf-avatar { width: 34px; height: 34px; flex-shrink: 0; transition: transform 0.25s ease; }
  .wf-avatar svg { width: 34px; height: 34px; display: block; border-radius: var(--r-xs); }
  .wf-item:hover .wf-avatar { transform: scale(1.06) rotate(-3deg); }

  .wf-copy { min-width: 0; }
  .wf-name { font-size: 13.5px; font-weight: 600; letter-spacing: -0.1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wf-meta { font-size: 11.5px; color: var(--muted-2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Compact density */
  .wf-list.compact .wf-item { padding: 7px 12px; gap: 10px; }
  .wf-list.compact .wf-avatar { width: 6px; height: 6px; border-radius: 50%; background: var(--sig-h); }
  .wf-list.compact .wf-avatar svg { display: none; }
  .wf-list.compact .wf-meta { display: none; }
  .wf-list.compact .wf-name { font-size: 13px; font-weight: 500; }
  .wf-list.compact .wf-item.selected .wf-name { font-weight: 600; }

  /* ── MAIN ── */
  .main { padding: 40px 44px 80px; max-width: 1080px; }

  .detail-eyebrow {
    font-size: 11px; font-weight: 600; letter-spacing: 1.3px; text-transform: uppercase;
    color: var(--muted-2); margin-bottom: 10px;
  }
  .detail-hd { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap; margin-bottom: 8px; }
  .detail-title { font-family: var(--serif); font-size: 32px; line-height: 1.18; letter-spacing: -0.2px; color: var(--text); }
  .detail-lede { font-size: 14px; color: var(--muted); line-height: 1.6; max-width: 62ch; margin-bottom: 26px; }

  .detail-rule { height: 1px; background: var(--border); margin-bottom: 26px; }

  /* Assignment control */
  .assign-wrap { position: relative; flex-shrink: 0; }
  .assign-badge {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: var(--sans); font-size: 12px; font-weight: 500;
    padding: 7px 12px; border-radius: 20px;
    background: var(--surface); color: var(--muted);
    border: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap;
    transition: background 0.14s, border-color 0.14s, color 0.14s;
  }
  .assign-badge:hover { background: var(--surface-h); border-color: var(--border-h); color: var(--text); }
  .assign-badge svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; opacity: 0.65; }
  .assign-badge .chev { transition: transform 0.18s ease; }
  .assign-badge.open .chev { transform: rotate(180deg); }

  .assign-menu {
    display: none; position: absolute; top: calc(100% + 6px); right: 0;
    min-width: 210px; background: #313A41;
    border: 1px solid var(--border-h); border-radius: var(--r-sm);
    box-shadow: 0 14px 34px rgba(0,0,0,0.55); z-index: 50; overflow: hidden;
    animation: dropIn 0.14s ease;
  }
  .assign-menu.open { display: block; }
  @keyframes dropIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: none; } }

  .menu-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 10px 14px; font-size: 13px; color: var(--muted); cursor: pointer;
    transition: background 0.1s, color 0.1s, padding-left 0.14s;
  }
  .menu-item:hover { background: rgba(255,255,255,0.06); color: var(--text); padding-left: 17px; }
  .menu-item.selected { color: var(--text); font-weight: 600; }
  .menu-item .tick { width: 13px; height: 13px; stroke: var(--sig-h); fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

  /* ── STAGES ── */
  .stages { display: grid; gap: 18px; }
  .stages.dual { grid-template-columns: 1fr 1fr; }

  .stage {
    position: relative;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r); padding: 22px 22px 20px;
    display: flex; flex-direction: column; gap: 12px;
    transition: background 0.18s, border-color 0.18s, transform 0.18s, box-shadow 0.18s;
    animation: riseIn 0.3s ease both;
  }
  .stage:hover { background: var(--surface-h); border-color: var(--border-h); transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,0.28); }
  .stage::before {
    content: ''; position: absolute; left: 0; top: 0; height: 2px; width: 0;
    border-radius: var(--r) 0 0 0; transition: width 0.32s ease;
  }
  .stage.s1::before { background: var(--stage1); }
  .stage.s2::before { background: var(--stage2); }
  .stage:hover::before { width: 100%; }
  @keyframes riseIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .stage-pill {
    display: inline-flex; align-items: center; gap: 6px; width: fit-content;
    font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase;
    padding: 3px 10px; border-radius: 100px;
  }
  .s1 .stage-pill { background: var(--stage1-dim); color: var(--stage1); border: 1px solid var(--stage1-border); }
  .s2 .stage-pill { background: var(--stage2-dim); color: var(--stage2); border: 1px solid var(--stage2-border); }

  .stage-title { font-family: var(--serif); font-size: 20px; line-height: 1.25; color: var(--text); }
  .stage-desc { font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* Sourcing note — only on workflows that permit external research */
  .stage-note {
    display: flex; align-items: flex-start; gap: 8px;
    font-size: 12px; line-height: 1.55; color: var(--muted);
    background: var(--sig-dim); border: 1px solid var(--sig-border);
    border-radius: var(--r-sm); padding: 9px 12px;
  }
  .stage-note svg { width: 13px; height: 13px; flex-shrink: 0; margin-top: 2px; stroke: var(--sig-h); fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .stage-note strong { color: var(--text); font-weight: 600; }

  /* Prompt preview */
  .prompt-shell { border: 1px solid var(--border); border-radius: var(--r-sm); overflow: hidden; background: #232A2F; transition: border-color 0.16s; }
  .stage:hover .prompt-shell { border-color: var(--border-h); }
  .prompt-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-size: 10.5px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted-2);
  }
  .prompt-toggle {
    display: flex; align-items: center; gap: 6px;
    background: none; border: none; cursor: pointer; color: var(--muted-2);
    font-family: var(--sans); font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;
    transition: color 0.14s;
  }
  .prompt-toggle:hover { color: var(--text); }
  .prompt-toggle svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.2s ease; }

  .prompt-body {
    position: relative; max-height: 132px; overflow: hidden;
    font-family: var(--mono); font-size: 11.5px; line-height: 1.62; color: #C6D0D6;
    padding: 12px 14px; white-space: pre-wrap; word-break: break-word;
    transition: max-height 0.28s ease;
  }
  .prompt-body::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 54px;
    background: linear-gradient(transparent, #232A2F); pointer-events: none;
    transition: opacity 0.2s;
  }
  .prompt-shell.expanded .prompt-body { max-height: 420px; overflow-y: auto; }
  .prompt-shell.expanded .prompt-body::after { opacity: 0; }
  .prompt-shell.expanded .prompt-toggle svg { transform: rotate(180deg); }

  /* Actions */
  .stage-actions { display: flex; align-items: center; gap: 8px; margin-top: 2px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 17px; border-radius: var(--r-sm);
    font-family: var(--sans); font-size: 13px; font-weight: 600;
    cursor: pointer; border: 1px solid transparent;
    transition: background 0.15s, box-shadow 0.15s, transform 0.1s, border-color 0.15s;
  }
  .btn:active { transform: scale(0.975); }
  .btn svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2.1; stroke-linecap: round; stroke-linejoin: round; }
  .s1 .btn-primary { background: var(--stage1-dim); color: var(--stage1); border-color: var(--stage1-border); }
  .s1 .btn-primary:hover { background: rgba(53,189,228,0.2); box-shadow: 0 0 0 4px rgba(53,189,228,0.09); }
  .s2 .btn-primary { background: var(--stage2-dim); color: var(--stage2); border-color: var(--stage2-border); }
  .s2 .btn-primary:hover { background: rgba(143,168,245,0.2); box-shadow: 0 0 0 4px rgba(143,168,245,0.09); }

  .btn-ghost { background: none; color: var(--muted); border-color: var(--border-h); font-weight: 500; }
  .btn-ghost:hover { background: var(--surface-3); color: var(--text); }

  /* ── EMPTY STATE ── */
  .empty {
    text-align: center; padding: 72px 24px; color: var(--muted-2);
    border: 1px dashed var(--border-h); border-radius: var(--r);
  }
  .empty svg { width: 30px; height: 30px; stroke: var(--muted-2); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; margin-bottom: 12px; opacity: 0.6; }
  .empty p { font-size: 14px; }
  .empty strong { color: var(--muted); }

  /* ── MODAL ── */
  .backdrop {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(12,16,19,0.72); backdrop-filter: blur(6px);
    align-items: center; justify-content: center; padding: 20px;
  }
  .backdrop.open { display: flex; }

  .modal {
    background: #313A41; border: 1px solid var(--border-h); border-radius: var(--r);
    width: 100%; max-width: 640px; padding: 24px 26px;
    display: flex; flex-direction: column; gap: 18px;
    box-shadow: 0 28px 66px rgba(0,0,0,0.62);
    animation: modalIn 0.17s ease;
  }
  @keyframes modalIn { from { opacity: 0; transform: scale(0.97) translateY(8px); } to { opacity: 1; transform: none; } }

  .modal-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .modal-title { font-family: var(--serif); font-size: 19px; }
  .modal-hd-right { display: flex; align-items: center; gap: 8px; }

  .reset-btn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: 1px solid var(--border-h); border-radius: var(--r-xs);
    cursor: pointer; color: var(--muted); padding: 5px 11px;
    font-family: var(--sans); font-size: 11px; font-weight: 600; letter-spacing: 0.2px;
    transition: color 0.13s, background 0.13s, border-color 0.13s, opacity 0.16s;
    opacity: 0; pointer-events: none;
  }
  .reset-btn.visible { opacity: 1; pointer-events: auto; }
  .reset-btn:hover { color: var(--text); background: var(--surface-3); }
  .reset-btn svg { width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }

  .close-btn { background: none; border: none; cursor: pointer; color: var(--muted); padding: 4px; border-radius: 4px; transition: color 0.13s, transform 0.16s; }
  .close-btn:hover { color: var(--text); transform: rotate(90deg); }
  .close-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; }

  .modal label {
    display: block; margin-bottom: 7px;
    font-size: 10.5px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; color: var(--muted-2);
  }
  .modal textarea {
    width: 100%; min-height: 300px; resize: vertical;
    background: #232A2F; border: 1px solid var(--border-h); border-radius: var(--r-sm);
    padding: 12px 14px; color: var(--text);
    font-family: var(--mono); font-size: 12px; line-height: 1.65;
    outline: none; transition: border-color 0.15s, box-shadow 0.15s;
  }
  .modal textarea:focus { border-color: var(--sig); box-shadow: 0 0 0 3px var(--sig-dim); }

  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
  .btn-cancel {
    background: none; border: 1px solid var(--border-h); border-radius: var(--r-sm);
    padding: 9px 18px; font-family: var(--sans); font-size: 13px; color: var(--muted);
    cursor: pointer; transition: background 0.13s, color 0.13s;
  }
  .btn-cancel:hover { background: var(--surface-3); color: var(--text); }
  .btn-save {
    background: var(--sig); color: #fff; border: none; border-radius: var(--r-sm);
    padding: 9px 22px; font-family: var(--sans); font-size: 13px; font-weight: 600;
    cursor: pointer; transition: background 0.13s, box-shadow 0.15s;
  }
  .btn-save:hover { background: var(--sig-h); box-shadow: 0 0 0 4px var(--sig-dim); }

  /* ── RESPONSIVE ── */
  @media (max-width: 1000px) {
    .shell { grid-template-columns: 1fr; }
    .rail { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); }
    .main { padding: 28px 20px 60px; }
    .stages.dual { grid-template-columns: 1fr; }
    .detail-title { font-size: 26px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
    html { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<div class="masthead">
  <div class="mark">
    <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
  </div>
  <span class="masthead-title">Prompt Library</span>
  <span class="masthead-div"></span>
  <span class="masthead-eyebrow">Procurement &middot; Supplier Intelligence</span>
</div>

<div class="shell">

  <!-- Rail -->
  <aside class="rail">
    <div class="rail-hd">
      <div class="rail-title">Workflows</div>
      <div class="rail-total" id="railTotal"></div>
    </div>

    <div class="filter-label">Category</div>
    <div class="filters" id="filters"></div>

    <div class="list-hd">
      <div class="filter-label" style="margin: 0; padding: 0;">Library</div>

  document.getElementById('editText').value = currentVal;
  document.getElementById('resetBtn').classList.remove('visible');
  document.getElementById('editModal').classList.add('open');
  setTimeout(() => document.getElementById('editText').focus(), 60);
}
function onEditInput() {
  const currentVal = document.getElementById('editText').value;
  const defaultVal = getDefaultForTarget(editTarget);
  document.getElementById('resetBtn').classList.toggle('visible', currentVal !== defaultVal);
}
function resetToDefault() {
  if (!editTarget) return;
  document.getElementById('editText').value = getDefaultForTarget(editTarget);
  document.getElementById('resetBtn').classList.remove('visible');
  document.getElementById('editText').focus();
}
function closeEdit() {
  document.getElementById('editModal').classList.remove('open');
  editTarget = null; editOriginalValue = '';
}
function saveEdit() {
  if (!editTarget) return;
  const v = document.getElementById('editText').value.trim();
  if (!v) return;
  if (editTarget.step === 1) cats[editTarget.i].s1 = v;
  else cats[editTarget.i].s2 = v;
  closeEdit(); renderLib();
}
document.getElementById('editModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeEdit(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeEdit(); closeAllDropdowns(); } });

function esc(s) {
  if (!s) return '';
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

renderTabs();
renderLib();
</script>
</body>
</html>
